<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Lucide's `dumbbell`, the same mark the sidebar header wears — so the tab
    and the app agree about what this is.

    `currentColor` with a `prefers-color-scheme` rule rather than a fixed
    ink: a black glyph vanishes into a dark browser chrome and a white one
    into a light one, and an SVG favicon is the only format that can answer
    both. The app itself is two explicit themes with no system mode, but a
    *tab* has no theme of its own to read — the surrounding chrome is the
    only signal there is.
  -->
  <style>
    :root { color: #18181b; }
    @media (prefers-color-scheme: dark) { :root { color: #fafafa; } }
  </style>
  <path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z" />
  <path d="m2.5 21.5 1.4-1.4" />
  <path d="m20.1 3.9 1.4-1.4" />
  <path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z" />
  <path d="m9.6 14.4 4.8-4.8" />
</svg>
